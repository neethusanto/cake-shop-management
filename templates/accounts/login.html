{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Log In - SweetDelight Cake Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 bg-white">
                <div class="text-center mb-4">
                    <div class="mb-3 d-inline-flex p-3 rounded-circle" style="background: var(--pastel-pink); color: var(--primary-deep); font-size: 2rem;">
                        <i class="fa-solid fa-cake-candles"></i>
                    </div>
                    <h3 class="fw-bold brand-font">Welcome Back</h3>
                    <p class="text-muted small">Sign in to book cakes, view orders & wishlist</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-cake-primary py-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? 
                        <a href="{% url 'accounts:register' %}" class="fw-bold text-decoration-none" style="color: var(--primary-rose);">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
